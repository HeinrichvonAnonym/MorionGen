<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t1 d1"><title id="t1">K alignment：观测驱动的模型重建</title><desc id="d1">运行时求解只接收 D 与声明输入；R 在独立评分端使用。图示为方法结构，非实测轨迹。</desc><defs><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#657789"/></marker></defs><rect width="1200" height="560" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#19334a}.small{font-size:16px;fill:#657789}.body{font-size:18px}.head{font-size:20px;font-weight:700}</style><text x="32" y="37" font-size="26" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">01  K alignment：观测驱动的模型重建</text><text x="32" y="66" font-size="16" font-weight="400" fill="#657789" style="fill:#657789" text-anchor="start">运行时求解只接收 D 与声明输入；R 在独立评分端使用。图示为方法结构，非实测轨迹。</text><rect x="25" y="92" width="1150" height="259" rx="6" fill="#f8fafc" stroke="#315b92" stroke-width="1.4" stroke-dasharray="6 5"/><text x="43" y="117" font-size="16" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">RUNTIME  ·  输入侧计算与候选输出</text><rect x="45" y="146" width="207" height="107" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="61" y="175" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">D：八格式观测</text><text x="61" y="202" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">位置 / 可用旋转</text><text x="61" y="225" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">时钟、掩码、input_rig</text><rect x="275" y="146" width="207" height="107" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="291" y="175" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">固定几何 θ</text><text x="291" y="202" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">节点注册、长度、范围</text><text x="291" y="225" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">片段内保持固定</text><rect x="505" y="146" width="207" height="107" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="521" y="175" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">姿态候选 q₁:T</text><text x="521" y="202" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">初值 → 逐帧 / 整段求解</text><text x="521" y="225" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">方向、位置、时序目标</text><rect x="735" y="146" width="207" height="107" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="751" y="175" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">组合 FK → F</text><text x="751" y="202" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">root 定位 + 头颈链</text><text x="751" y="225" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">原生解 / 导出回读</text><path d="M252,199 L273,199" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow1)" /><path d="M482,199 L503,199" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow1)" /><path d="M712,199 L733,199" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow1)" /><rect x="965" y="146" width="190" height="107" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="981" y="175" font-size="19" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">D-only 质量选择</text><text x="981" y="202" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">保留候选 / 回退</text><text x="981" y="225" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">整段选择或分支输出</text><path d="M942,199 L963,199" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow1)" /><text x="47" y="293" font-size="18" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">FK（正运动学）：由关节坐标 q 与固定模型 θ 重新计算节点位置和段旋转。</text><text x="47" y="321" font-size="16" font-weight="400" fill="#657789" style="fill:#657789" text-anchor="start">头胸原生旋转读出另列；欠观测分量保持未知。模型几何与评分用共同骨长分别管理。</text><rect x="45" y="398" width="207" height="111" rx="6" fill="#fff7e8" stroke="#b57418" stroke-width="1.4" /><text x="61" y="427" font-size="19" font-weight="700" fill="#b57418" style="fill:#b57418" text-anchor="start">R：退化前原动作</text><text x="61" y="454" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">只进入受控构造与验收</text><text x="61" y="477" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">运行时无 R 回路</text><rect x="320" y="398" width="445" height="111" rx="6" fill="#fff7e8" stroke="#b57418" stroke-width="1.4" /><text x="336" y="427" font-size="19" font-weight="700" fill="#b57418" style="fill:#b57418" text-anchor="start">独立评分：D−R / F−D / F−R</text><text x="336" y="454" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">原始几何 + 统一骨长；native / export × D / R 时钟</text><text x="336" y="477" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">完整窗口、来源跳变分层、有效覆盖、实际文件回读</text><rect x="820" y="398" width="330" height="111" rx="6" fill="#fff7e8" stroke="#b57418" stroke-width="1.4" /><text x="836" y="427" font-size="19" font-weight="700" fill="#b57418" style="fill:#b57418" text-anchor="start">两类不同的结论</text><text x="836" y="454" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">原动作准确度：5° / 5 cm 与时序</text><text x="836" y="477" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">计算迁移一致性：CPU ↔ GPU</text><path d="M252,453 L318,453" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow1)" /><path d="M843,253 L843,374 L633,374 L633,397" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow1)" /><path d="M149,253 L149,371 L431,371 L431,397" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow1)" stroke-dasharray="6 5"/><path d="M765,453 L818,453" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow1)" /></svg>