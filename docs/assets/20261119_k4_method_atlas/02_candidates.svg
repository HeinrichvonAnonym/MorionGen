<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="t2 d2"><title id="t2">候选方法：几何、目标与求解方式的组合</title><desc id="d2">当前消融协议声明 13 个原生配置 + 11 个协调导出变体 = 24 列；按输入契约判定适用性。</desc><defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#657789"/></marker></defs><rect width="1200" height="580" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#19334a}.small{font-size:16px;fill:#657789}.body{font-size:18px}.head{font-size:20px;font-weight:700}</style><text x="32" y="37" font-size="26" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">02  候选方法：几何、目标与求解方式的组合</text><text x="32" y="66" font-size="16" font-weight="400" fill="#657789" style="fill:#657789" text-anchor="start">当前消融协议声明 13 个原生配置 + 11 个协调导出变体 = 24 列；按输入契约判定适用性。</text><rect x="34" y="110" width="270" height="136" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="50" y="139" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">A  固定几何 / 注册</text><text x="50" y="166" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">源骨架关节中心与肩宽</text><text x="50" y="189" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">位置链长代理 / 总链长代理</text><text x="50" y="212" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">足端注册 / 输入足部几何</text><rect x="34" y="275" width="270" height="136" rx="6" fill="#fff7e8" stroke="#b57418" stroke-width="1.4" /><text x="50" y="304" font-size="19" font-weight="700" fill="#b57418" style="fill:#b57418" text-anchor="start">B  范围与耦合</text><text x="50" y="331" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立运动学坐标域</text><text x="50" y="354" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">膝辅助耦合延拓</text><text x="50" y="377" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">记录原模型范围与变化</text><rect x="344" y="110" width="362" height="136" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="360" y="139" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">C  逐帧方向—位置拟合</text><text x="360" y="166" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">nominal / continuity / 条件追加初值</text><text x="360" y="189" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">骨盆线、方向、几何角、端点位置</text><text x="360" y="212" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">正向 / 反向遍历；新增变化率约束</text><rect x="344" y="275" width="362" height="136" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="360" y="304" font-size="19" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">D  整段轨迹联合求解</text><text x="360" y="331" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">位置输入轨迹与等价坐标图</text><text x="360" y="354" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">全窗口 q₁:T + 相邻方向误差变化</text><text x="360" y="377" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">有界 GN / TRF–LSMR（按配置）</text><rect x="748" y="110" width="416" height="136" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="764" y="139" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">E  头颈、root 与输出路径</text><text x="764" y="166" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">头颈链附着身体胸段，固定长度</text><text x="764" y="189" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">双髋中点定位 root 后重新 FK</text><text x="764" y="212" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">SO(3) 初始插值 + 可选跨关节协调</text><rect x="748" y="275" width="416" height="136" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="764" y="304" font-size="19" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">F  候选验收 / 选择分列</text><text x="764" y="331" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">每个适用候选分别对 R 验收</text><text x="764" y="354" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">D-only 选择器单独评价命中 / 漏选</text><text x="764" y="377" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">完整消融保留弱对照与失败</text><path d="M304,178 L342,178" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow2)" /><path d="M304,343 L342,343" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow2)" /><path d="M706,178 L746,178" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow2)" /><path d="M706,343 L746,343" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow2)" /><path d="M956,246 L956,273" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow2)" /><rect x="34" y="448" width="1130" height="98" rx="6" fill="#f4f6f8" stroke="#a6b3be" stroke-width="1.4" /><text x="54" y="479" font-size="23" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">min  E(q) = Eposition + Edirection + Eangle + Etemporal     s.t. q ∈ Qθ</text><text x="54" y="513" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">概念分解；Qθ表示坐标域与耦合。权重与停止规则按配置固定；多因素候选比较需另做因果消融。</text></svg>