<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title2"><title id="title2">Residual geometry &amp; candidate interventions</title><defs><marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7Z" fill="#8494a4"/></marker></defs><rect width="1200" height="760" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172c43}.math{font-family:"DejaVu Serif",Georgia,serif}.bone{stroke-linecap:round;stroke-linejoin:round}</style><text x="28" y="34" font-size="25" font-weight="700" style="fill:#172c43" text-anchor="start">02  Residual geometry &amp; candidate interventions</text><text x="28" y="63" font-size="15" font-weight="400" style="fill:#8494a4" text-anchor="start">方向残差采用单位向量弦长；逐帧目标含坐标连续项，整段目标在观测特征误差上耦合。</text><path d="M28 82 L1172 82" stroke="#dce4eb" stroke-width="1" fill="none" /><text x="30" y="119" font-size="19" font-weight="700" style="fill:#245a9b" text-anchor="start">a</text><text x="59" y="119" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">单帧残差：现有 refinement.py</text><text x="40" y="164" font-size="22" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">p̄ = p − mean(pLH, pRH),     u = v / ‖v‖</text><text x="40" y="209" font-size="23" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">rₚ = wₚ (p̄ − p̄ᴰ) / σₚ</text><text x="40" y="253" font-size="23" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">rᵤ = (u − uᴰ) / [2 sin(σₐ / 2)]</text><text x="40" y="297" font-size="23" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">rα = wₐ (α − αᴰ) / σₐ</text><text x="40" y="341" font-size="21" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">r<tspan baseline-shift="sub" font-size="70%">q</tspan> = w<tspan baseline-shift="sub" font-size="70%">q</tspan> (qₜ − qₜ₋₁) / [2 sin(σₐ / 2)]</text><text x="40" y="385" font-size="20" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">rΔe = wΔ [(u−uᴰ)ₜ − (u−uᴰ)ₜ₋₁] / (σv Δt)</text><text x="40" y="426" font-size="16" font-weight="400" style="fill:#8494a4" text-anchor="start">另加：归一目标超额 hinge 惩罚；可选段旋转目标。</text><text x="40" y="454" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="start">σp = 0.05 m；σa = 5°；σv = 10°/s。</text><path d="M620 104 L620 484" stroke="#dce4eb" stroke-width="1" fill="none" /><text x="652" y="119" font-size="19" font-weight="700" style="fill:#245a9b" text-anchor="start">b</text><text x="681" y="119" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">状态因子与候选差别</text><circle cx="724" cy="267" r="28" stroke="#245a9b" stroke-width="1.6" fill="white"/><text x="724" y="274" font-size="20" font-weight="700" style="fill:#172c43" text-anchor="middle" class="math">qₜ₋₁</text><rect x="710" y="170" width="28" height="28" rx="0" stroke="#d48333" fill="#fff2e5" /><path d="M724 198 L724 239" stroke="#8494a4" stroke-width="1.5" fill="none" /><text x="724" y="153" font-size="19" font-weight="400" style="fill:#172c43" text-anchor="middle" class="math">Dₜ₋₁</text><circle cx="1003" cy="267" r="28" stroke="#245a9b" stroke-width="1.6" fill="white"/><text x="1003" y="274" font-size="20" font-weight="700" style="fill:#172c43" text-anchor="middle" class="math">qₜ</text><rect x="989" y="170" width="28" height="28" rx="0" stroke="#d48333" fill="#fff2e5" /><path d="M1003 198 L1003 239" stroke="#8494a4" stroke-width="1.5" fill="none" /><text x="1003" y="153" font-size="19" font-weight="400" style="fill:#172c43" text-anchor="middle" class="math">Dₜ</text><path d="M752 267 L851 267" stroke="#8494a4" stroke-width="1.5" fill="none" /><rect x="851" y="253" width="28" height="28" rx="0" stroke="#0c8e9a" fill="#e7f6f4" /><path d="M879 267 L975 267" stroke="#8494a4" stroke-width="1.5" fill="none" /><text x="866" y="229" font-size="19" font-weight="400" style="fill:#172c43" text-anchor="middle" class="math">Δe / Δt</text><text x="867" y="314" font-size="16" font-weight="400" style="fill:#172c43" text-anchor="middle">前态同时影响残差与初值</text><rect x="676" y="361" width="470" height="102" rx="0" stroke="#dce4eb" fill="#f6f8fa" /><text x="693" y="389" font-size="22" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">单帧：min ‖r(qₜ ; stateₜ₋₁)‖²</text><text x="693" y="421" font-size="16" font-weight="400" style="fill:#172c43" text-anchor="start">nominal / continuity → TRF → 条件重启</text><text x="693" y="446" font-size="15" font-weight="400" style="fill:#8494a4" text-anchor="start">选择读取D；从原动作R挑最优属于事后上界。</text><path d="M28 490 L1172 490" stroke="#dce4eb" stroke-width="1" fill="none" /><text x="30" y="526" font-size="19" font-weight="700" style="fill:#245a9b" text-anchor="start">c</text><text x="59" y="526" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">13个原生候选改变的四类因素</text><circle cx="67" cy="582" r="26" stroke="#245a9b" stroke-width="1.6" fill="white"/><text x="67" y="591" font-size="23" font-weight="700" style="fill:#172c43" text-anchor="middle" class="math">θ</text><text x="104" y="578" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">固定几何</text><text x="36" y="640" font-size="15" font-weight="400" style="fill:#172c43" text-anchor="start">中心、肩宽、足端、链长代理</text><path d="M39 659 L282 659" stroke="#dce4eb" stroke-width="2" fill="none" /><circle cx="360" cy="582" r="26" stroke="#245a9b" stroke-width="1.6" fill="white"/><text x="360" y="591" font-size="23" font-weight="700" style="fill:#172c43" text-anchor="middle" class="math">Qθ</text><text x="397" y="578" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">可行域</text><text x="329" y="640" font-size="15" font-weight="400" style="fill:#172c43" text-anchor="start">坐标范围与已声明耦合延拓</text><path d="M332 659 L575 659" stroke="#dce4eb" stroke-width="2" fill="none" /><circle cx="653" cy="582" r="26" stroke="#245a9b" stroke-width="1.6" fill="white"/><text x="653" y="591" font-size="23" font-weight="700" style="fill:#172c43" text-anchor="middle" class="math">r</text><text x="690" y="578" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">目标/权重</text><text x="622" y="640" font-size="15" font-weight="400" style="fill:#172c43" text-anchor="start">骨盆线、hinge、方向误差变化</text><path d="M625 659 L868 659" stroke="#dce4eb" stroke-width="2" fill="none" /><circle cx="946" cy="582" r="26" stroke="#245a9b" stroke-width="1.6" fill="white"/><text x="946" y="591" font-size="23" font-weight="700" style="fill:#172c43" text-anchor="middle" class="math">S</text><text x="983" y="578" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">求解路径</text><text x="915" y="640" font-size="15" font-weight="400" style="fill:#172c43" text-anchor="start">遍历、初值、等价图、整段</text><path d="M918 659 L1161 659" stroke="#dce4eb" stroke-width="2" fill="none" /><text x="36" y="705" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">这些是多因素配置，不是13种独立优化算法。11个导出变体另改变插值路径，复用原生解。</text><text x="36" y="735" font-size="17" font-weight="400" style="fill:#b95669" text-anchor="start">重要限制：坐标连续残差仍是坐标差；它与SO(3)导出插值、独立旋转测地评分是不同层次。</text></svg>