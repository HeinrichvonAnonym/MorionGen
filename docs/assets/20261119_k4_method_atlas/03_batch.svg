<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title3"><title id="title3">Temporal coupling determines the parallelization axis</title><defs><marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7Z" fill="#8494a4"/></marker></defs><rect width="1200" height="700" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172c43}.math{font-family:"DejaVu Serif",Georgia,serif}.bone{stroke-linecap:round;stroke-linejoin:round}</style><text x="28" y="34" font-size="25" font-weight="700" style="fill:#172c43" text-anchor="start">03  Temporal coupling determines the parallelization axis</text><text x="28" y="63" font-size="15" font-weight="400" style="fill:#8494a4" text-anchor="start">批处理应沿独立系统和同次迭代的模型评价展开；迭代与前态依赖保持原算法语义。</text><path d="M28 82 L1172 82" stroke="#dce4eb" stroke-width="1" fill="none" /><text x="30" y="119" font-size="19" font-weight="700" style="fill:#245a9b" text-anchor="start">a</text><text x="59" y="119" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">逐帧：沿序列传播状态</text><text x="35" y="182" font-size="19" font-weight="700" style="fill:#172c43" text-anchor="start" class="math">s1</text><circle cx="110" cy="176" r="19" stroke="#245a9b" stroke-width="1.6" fill="white"/><text x="110" y="182" font-size="15" font-weight="400" style="fill:#172c43" text-anchor="middle" class="math">q0</text><path d="M130 176 L204 176" stroke="#8494a4" stroke-width="1.5" fill="none" marker-end="url(#a3)"/><circle cx="224" cy="176" r="19" stroke="#245a9b" stroke-width="1.6" fill="white"/><text x="224" y="182" font-size="15" font-weight="400" style="fill:#172c43" text-anchor="middle" class="math">q1</text><path d="M244 176 L318 176" stroke="#8494a4" stroke-width="1.5" fill="none" marker-end="url(#a3)"/><circle cx="338" cy="176" r="19" stroke="#245a9b" stroke-width="1.6" fill="white"/><text x="338" y="182" font-size="15" font-weight