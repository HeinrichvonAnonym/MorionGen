rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="806" y="306" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="626" y="328" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="671" y="328" width="39" height="17" rx="0" stroke="#dce4eb" fill="#19999c" /><rect x="716" y="328" width="39" height="17" rx="0" stroke="#dce4eb" fill="#19999c" /><rect x="761" y="328" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="806" y="328" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="626" y="350" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="671" y="350" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="716" y="350" width="39" height="17" rx="0" stroke="#dce4eb" fill="#19999c" /><rect x="761" y="350" width="39" height="17" rx="0" stroke="#dce4eb" fill="#19999c" /><rect x="806" y="350" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="626" y="372" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="671" y="372" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="716" y="372" width="39" height="17" rx="0" stroke="#dce4eb" fill="#f3f6f8" /><rect x="761" y="372" width="39" height="17" rx="0" stroke="#dce4eb" fill="#19999c" /><rect x="806" y="372" width="39" height="17" rx="0" stroke="#dce4eb" fill="#19999c" /><text x="868" y="248" font-size="17" font-weight="400" style="fill:#245a9b" text-anchor="start">Jφ：逐帧对角块</text><text x="868" y="353" font-size="17" font-weight="400" style="fill:#0c8e9a" text-anchor="start">LJφ：相邻帧耦合</text><text x="596" y="437" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="start">JᵀJ呈块带状；边界与活跃集仍影响每轮求解。</text><path d="M28 476 L1172 476" stroke="#dce4eb" stroke-width="1" fill="none" /><text x="30" y="512" font-size="19" font-weight="700" style="fill:#245a9b" text-anchor="start">c</text><text x="59" y="512" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">保持算法的Batch与改变算法的并行</text><text x="35" y="550" font-size="18" font-weight="700" style="fill:#0c8e9a" text-anchor="start">可保持语义</text><text x="205" y="550" font-size="18" font-weight="400" style="fill:#172c43" text-anchor="start">扰动列；独立初值；独立序列/候选；给定Q后的全帧FK。</text><text x="35" y="592" font-size="18" font-weight="700" style="fill:#d48333" text-anchor="start">需控制依赖</text><text x="205" y="592" font-size="18" font-weight="400" style="fill:#172c43" text-anchor="start">线搜索接受顺序、条件重启、收敛掩码、预算、下一轮更新。</text><text x="35" y="634" font-size="18" font-weight="700" style="fill:#b95669" text-anchor="start">另设算法条件</text><text x="205" y="634" font-size="18" font-weight="400" style="fill:#172c43" text-anchor="start">移除前态；独立拟合所有帧；更换线性求解器；减少初值。</text><text x="35" y="676" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">当前缺口：异构固定几何的batched model，以及设备端完整求解状态机。</text></svg>