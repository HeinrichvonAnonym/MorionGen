<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 595" role="img" aria-labelledby="t3 d3"><title id="t3">并行的边界：沿 Batch 扩展，沿状态依赖推进</title><desc id="d3">灰蓝箭头是必须保留的状态依赖；绿色列表示同一时刻可聚合的计算。</desc><defs><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#657789"/></marker></defs><rect width="1200" height="595" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#19334a}.small{font-size:16px;fill:#657789}.body{font-size:18px}.head{font-size:20px;font-weight:700}</style><text x="32" y="37" font-size="26" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">03  并行的边界：沿 Batch 扩展，沿状态依赖推进</text><text x="32" y="66" font-size="16" font-weight="400" fill="#657789" style="fill:#657789" text-anchor="start">灰蓝箭头是必须保留的状态依赖；绿色列表示同一时刻可聚合的计算。</text><text x="35" y="110" font-size="19" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">A  连续逐帧拟合：qₜ₋₁ 会影响当前初值与时序残差</text><text x="40" y="172" font-size="18" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">序列 A</text><rect x="160" y="140" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="176" y="169" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t</text><text x="176" y="196" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 A · FK / J</text><path d="M335,170 L378,170" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow3)" /><rect x="380" y="140" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="396" y="169" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t+1</text><text x="396" y="196" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 A · FK / J</text><path d="M555,170 L598,170" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow3)" /><rect x="600" y="140" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="616" y="169" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t+2</text><text x="616" y="196" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 A · FK / J</text><path d="M775,170 L818,170" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow3)" /><rect x="820" y="140" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="836" y="169" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t+3</text><text x="836" y="196" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 A · FK / J</text><text x="40" y="253" font-size="18" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">序列 B</text><rect x="160" y="221" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="176" y="250" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t</text><text x="176" y="277" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 B · FK / J</text><path d="M335,251 L378,251" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow3)" /><rect x="380" y="221" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="396" y="250" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t+1</text><text x="396" y="277" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 B · FK / J</text><path d="M555,251 L598,251" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow3)" /><rect x="600" y="221" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="616" y="250" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t+2</text><text x="616" y="277" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 B · FK / J</text><path d="M775,251 L818,251" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow3)" /><rect x="820" y="221" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="836" y="250" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t+3</text><text x="836" y="277" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 B · FK / J</text><text x="40" y="334" font-size="18" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">序列 C</text><rect x="160" y="302" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="176" y="331" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t</text><text x="176" y="358" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 C · FK / J</text><path d="M335,332 L378,332" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow3)" /><rect x="380" y="302" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="396" y="331" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t+1</text><text x="396" y="358" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 C · FK / J</text><path d="M555,332 L598,332" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow3)" /><rect x="600" y="302" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="616" y="331" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t+2</text><text x="616" y="358" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 C · FK / J</text><path d="M775,332 L818,332" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow3)" /><rect x="820" y="302" width="175" height="60" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="836" y="331" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">帧 t+3</text><text x="836" y="358" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立状态 C · FK / J</text><rect x="149" y="132" width="197" height="235" rx="6" fill="none" stroke="#137e79" stroke-width="1.4" stroke-dasharray="6 5"/><text x="175" y="392" font-size="17" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">跨序列微批</text><text x="390" y="392" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">不同序列保持各自时钟、活动坐标与停止状态</text><rect x="35" y="432" width="350" height="122" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="51" y="461" font-size="19" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">B  同一迭代可批量</text><text x="51" y="488" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">有限差分扰动列；独立常规初值</text><text x="51" y="511" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">独立候选；输入已就绪的序列</text><rect x="425" y="432" width="350" height="122" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="441" y="461" font-size="19" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">C  整段求解可批量</text><text x="441" y="488" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">给定 q₁:T 后，全帧 FK / 残差</text><text x="441" y="511" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">时序产生块稀疏耦合，保留结构</text><rect x="815" y="432" width="350" height="122" rx="6" fill="#fff7e8" stroke="#b57418" stroke-width="1.4" /><text x="831" y="461" font-size="19" font-weight="700" fill="#b57418" style="fill:#b57418" text-anchor="start">D  保持顺序的部分</text><text x="831" y="488" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">迭代更新、触发条件、接受决策</text><text x="831" y="511" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">逻辑顺序可保留在 GPU 上执行</text></svg>