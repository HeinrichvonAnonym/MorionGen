<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title4"><title id="title4">Where the solver actually runs</title><defs><marker id="a4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7Z" fill="#8494a4"/></marker></defs><rect width="1200" height="690" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172c43}.math{font-family:"DejaVu Serif",Georgia,serif}.bone{stroke-linecap:round;stroke-linejoin:round}</style><text x="28" y="34" font-size="25" font-weight="700" style="fill:#172c43" text-anchor="start">04  Where the solver actually runs</text><text x="28" y="63" font-size="15" font-weight="400" style="fill:#8494a4" text-anchor="start">当前CPU-policy路径：CPU持有算法状态，GPU持有固定模型并执行批量FK；箭头为数值交换。</text><path d="M28 82 L1172 82" stroke="#dce4eb" stroke-width="1" fill="none" /><text x="30" y="118" font-size="19" font-weight="700" style="fill:#245a9b" text-anchor="start">a</text><text x="59" y="118" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">实际执行分区</text><rect x="52" y="160" width="398" height="280" rx="12" stroke="#245a9b" fill="#f6f8fc" /><rect x="80" y="186" width="342" height="80" rx="0" stroke="#245a9b" fill="white" /><text x="98" y="214" font-size="22" font-weight="700" style="fill:#172c43" text-anchor="start">CPU · SciPy / NumPy</text><text x="98" y="244" font-size="20" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">TRF / bounded GN / LSMR</text><rect x="88" y="295" width="62" height="60" rx="3" stroke="#245a9b" fill="#e6edf6" /><text x="119" y="331" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="middle" class="math">seed</text><rect x="167" y="295" width="62" height="60" rx="3" stroke="#245a9b" fill="#e6edf6" /><text x="198" y="331" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="middle" class="math">J,r</text><rect x="246" y="295" width="62" height="60" rx="3" stroke="#245a9b" fill="#e6edf6" /><text x="277" y="331" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="middle" class="math">step</text><rect x="325" y="295" width="62" height="60" rx="3" stroke="#245a9b" fill="#e6edf6" /><text x="356" y="331" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="middle" class="math">stop</text><text x="86" y="400" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="start">残差组装 · 稀疏算子 · 接受/回退</text><rect x="735" y="160" width="398" height="280" rx="12" stroke="#0c8e9a" fill="#f1faf9" /><rect x="761" y="185" width="346" height="80" rx="0" stroke="#0c8e9a" fill="white" /><text x="780" y="214" font-size="22" font-weight="700" style="fill:#172c43" text-anchor="start">GPU · resident θ / float64</text><text x="780" y="244" font-size="19" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">CUDA Graph + batched FK</text><rect x="774" y="294" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="774" y="318" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="774" y="342" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="814" y="294" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="814" y="318" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="814" y="342" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="854" y="294" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="854" y="318" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="854" y="342" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="894" y="294" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="894" y="318" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="894" y="342" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="934" y="294" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="934" y="318" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="934" y="342" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="974" y="294" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="974" y="318" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="974" y="342" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="1014" y="294" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="1014" y="318" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="1014" y="342" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="1054" y="294" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="1054" y="318" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><rect x="1054" y="342" width="31" height="15" rx="0" stroke="#0c8e9a" fill="#b6e0da" /><text x="777" y="400" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="start">q、q±h列 → 点 / 所需段旋转</text><path d="M450 215 L733 215" stroke="#8494a4" stroke-width="1.5" fill="none" marker-end="url(#a4)"/><text x="487" y="193" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="start">批量坐标 / 扰动列</text><path d="M735 322 L452 322" stroke="#8494a4" stroke-width="1.5" fill="none" marker-end="url(#a4)"/><text x="490" y="301" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="start">FK数值；按需回读</text><path d="M85 439 L85 457 L32 457 L32 147 L85 147 L85 159" stroke="#8494a4" stroke-width="1.5" fill="none" /><text x="115" y="474" font-size="17" font-weight="400" style="fill:#8494a4" text-anchor="start">每轮重复；结果仍依赖CPU决策</text><path d="M28 497 L1172 497" stroke="#dce4eb" stroke-width="1" fill="none" /><text x="30" y="533" font-size="19" font-weight="700" style="fill:#245a9b" text-anchor="start">b</text><text x="59" y="533" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">已做与未做，对齐到同一计算图</text><circle cx="47" cy="572" r="6" stroke="#0c8e9a" stroke-width="1.6" fill="#0c8e9a"/><text x="65" y="578" font-size="18" font-weight="400" style="fill:#172c43" text-anchor="start">已接入：有限差分FK批、模型驻留、图捕获、轻量协议。</text><circle cx="47" cy="612" r="6" stroke="#d48333" stroke-width="1.6" fill="#d48333"/><text x="65" y="618" font-size="18" font-weight="400" style="fill:#172c43" text-anchor="start">局部：同模型跨序列微批、并行初值、CPU转置CSR缓存。</text><circle cx="47" cy="652" r="6" stroke="#b95669" stroke-width="1.6" fill="#b95669"/><text x="65" y="658" font-size="18" font-weight="400" style="fill:#172c43" text-anchor="start">待完成：设备端r/J与线性子问题、迭代状态机、异构几何Batch。</text></svg>