<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t4 d4"><title id="t4">CPU ↔ GPU：当前工程路径与剩余成本</title><desc id="d4">蓝色为当前 CPU 控制；绿色为已接入计算；虚线框为待完成的工程能力。</desc><defs><marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#657789"/></marker></defs><rect width="1200" height="600" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#19334a}.small{font-size:16px;fill:#657789}.body{font-size:18px}.head{font-size:20px;font-weight:700}</style><text x="32" y="37" font-size="26" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">04  CPU ↔ GPU：当前工程路径与剩余成本</text><text x="32" y="66" font-size="16" font-weight="400" fill="#657789" style="fill:#657789" text-anchor="start">蓝色为当前 CPU 控制；绿色为已接入计算；虚线框为待完成的工程能力。</text><rect x="30" y="105" width="470" height="350" rx="6" fill="#f5f8fc" stroke="#315b92" stroke-width="1.4" /><text x="53" y="136" font-size="22" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">CPU · 冻结算法与残差定义</text><rect x="53" y="157" width="424" height="98" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="69" y="186" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">① 初值 / 边界 / 收敛与预算</text><text x="69" y="213" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">SciPy TRF；整段 GN / LSMR</text><text x="69" y="236" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">每个样本保留原停止状态</text><rect x="53" y="292" width="424" height="110" rx="6" fill="#fff7e8" stroke="#b57418" stroke-width="1.4" /><text x="69" y="321" font-size="19" font-weight="700" fill="#b57418" style="fill:#b57418" text-anchor="start">④ 线性子问题与接受步骤</text><text x="69" y="348" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">残差组装、稀疏线性代数、线搜索</text><text x="69" y="371" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">迭代仍在 CPU，尚无完整设备控制</text><rect x="700" y="105" width="470" height="350" rx="6" fill="#f2faf8" stroke="#137e79" stroke-width="1.4" /><text x="723" y="136" font-size="22" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">GPU · 常驻固定模型</text><rect x="723" y="157" width="424" height="98" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="739" y="186" font-size="19" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">② 批量 FK / 有限差分扰动</text><text x="739" y="213" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">float64；关闭 TF32 / 混合精度</text><text x="739" y="236" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">模型缓存、CUDA Graph、坐标批变换</text><rect x="723" y="292" width="424" height="110" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="739" y="321" font-size="19" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">③ 回传所需数值</text><text x="739" y="348" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">轻量数值协议；按需旋转输出</text><text x="739" y="371" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">CPU 继续残差与决策</text><path d="M477,203 L721,203" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow4)" /><text x="528" y="188" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">q 与扰动批</text><path d="M935,255 L935,290" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow4)" /><path d="M723,347 L479,347" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow4)" /><text x="540" y="331" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">位置 / 旋转</text><path d="M63,292 L42,292 L42,267 L63,267 L63,255" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow4)" /><rect x="30" y="488" width="540" height="89" rx="6" fill="#f4f6f8" stroke="#a6b3be" stroke-width="1.4" /><text x="46" y="517" font-size="19" font-weight="700" fill="#a6b3be" style="fill:#a6b3be" text-anchor="start">为什么需要回传？</text><text x="46" y="544" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">当前决策仍在 SciPy / NumPy；协议隔离两个既有环境。</text><text x="46" y="567" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">保留同一算法迁移到设备控制后，可减少这些边界。</text><rect x="610" y="488" width="560" height="89" rx="6" fill="#fff7e8" stroke="#b57418" stroke-width="1.4" stroke-dasharray="6 5"/><text x="630" y="517" font-size="18" font-weight="700" fill="#b57418" style="fill:#b57418" text-anchor="start">待完成：设备端线性求解 + 收敛掩码 + 异构几何 Batch</text><text x="630" y="548" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">迁移逐项验收；更换求解算法另设条件。</text></svg>