<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title5"><title id="title5">Interpolation on SO(3) does not constrain task-space paths</title><defs><marker id="a5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7Z" fill="#8494a4"/></marker></defs><rect width="1200" height="700" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172c43}.math{font-family:"DejaVu Serif",Georgia,serif}.bone{stroke-linecap:round;stroke-linejoin:round}</style><text x="28" y="34" font-size="25" font-weight="700" style="fill:#172c43" text-anchor="start">05  Interpolation on SO(3) does not constrain task-space paths</text><text x="28" y="63" font-size="15" font-weight="400" style="fill:#8494a4" text-anchor="start">原生锚点固定；末端轨迹由多关节组合FK决定。曲线为反例示意，非当前样本测量。</text><path d="M28 82 L1172 82" stroke="#dce4eb" stroke-width="1" fill="none" /><text x="30" y="120" font-size="19" font-weight="700" style="fill:#245a9b" text-anchor="start">a</text><text x="59" y="120" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">关节独立插值 → 末端可偏离</text><path d="M207 185 L149.6423563648954 266.9152044288992" stroke="#245a9b" stroke-width="5" fill="none" /><path d="M149.6423563648954 266.9152044288992 L89.64235636489542 370.8382528830318" stroke="#245a9b" stroke-width="5" fill="none" /><circle cx="207" cy="185" r="6" stroke="#245a9b" stroke-width="1.6" fill="white"/><circle cx="149.6423563648954" cy="266.9152044288992" r="6" stroke="#245a9b" stroke-width="1.6" fill="white"/><circle cx="89.64235636489542" cy="370.8382528830318" r="6" stroke="#245a9b" stroke-width="1.6" fill="white"/><path d="M207 185 L232.88190451025207 281.5925826289068" stroke="#d48333" stroke-width="3" fill="none" /><path d="M232.88190451025207 281.5925826289068 L331.1801498249311 350.42175499103234" stroke="#d48333" stroke-width="3" fill="none" /><circle cx="207" cy="185" r="6" stroke="#d48333" stroke-width="1.6" fill="white"/><circle cx="232.88190451025207" cy="281.5925826289068" r="6" stroke="#d48333" stroke-width="1.6" fill="white"/><circle cx="331.1801498249311" cy="350.42175499103234" r="6" stroke="#d48333" stroke-width="1.6" fill="white"/><path d="M207 185 L297.630778703665 227.26182617406994" stroke="#245a9b" stroke-width="5" fill="none" /><path d="M297.630778703665 227.26182617406994 L374.7652918660497 135.3364929997926" stroke="#245a9b" stroke-width="5" fill="none" /><circle cx="207" cy="185" r="6" stroke="#245a9b" stroke-width="1.6" fill="white"/><circle cx="297.630778703665" cy="227.26182617406994" r="6" stroke="#245a9b" stroke-width="1.6" fill="white"/><circle cx="374.7652918660497" cy="135.3364929997926" r="6" stroke="#245a9b" stroke-width="1.6" fill="white"/><path d="M89.642 370.838 L101.137 377.423 L113.020 383.253 L125.240 388.303 L137.744 392.555 L150.477 395.991 L163.383 398.599 L176.406 400.371 L189.489 401.300 L202.575 401.388 L215.608 400.636 L228.531 399.053 L241.289 396.649 L253.826 393.439 L266.091 389.443 L278.030 384.681 L289.595 379.181 L300.737 372.971 L311.410 366.083 L321.571 358.554 L331.180 350.422 L340.199 341.727 L348.594 332.513 L356.333 322.826 L363.389 312.713 L369.736 302.223 L375.354 291.408 L380.227 280.319 L384.339 269.009 L387.683 257.532 L390.252 245.941 L392.044 234.291 L393.062 222.634 L393.311 211.025 L392.800 199.516 L391.543 188.157 L389.556 177.001 L386.859 166.095 L383.477 155.486 L379.436 145.219 L374.765 135.336" stroke="#d48333" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M89.64235636489542 370.8382528830318 L374.7652918660497 135.3364929997926" stroke="#0c8e9a" stroke-width="2" fill="none" stroke-dasharray="5 4" /><text x="44" y="431" font-size="21" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">R(α) = R₀ exp[α log(R₀ᵀR₁)]</text><text x="44" y="465" font-size="16" font-weight="400" style="fill:#172c43" text-anchor="start">每个关节的SO(3)路径不固定多关节末端轨迹。</text><text x="590" y="120" font-size="19" font-weight="700" style="fill:#245a9b" text-anchor="start">b</text><text x="619" y="120" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">固定原生锚点的任务空间协调</text><circle cx="668" cy="348" r="8" stroke="#245a9b" stroke-width="1.6" fill="white"/><circle cx="803" cy="275" r="8" stroke="#245a9b" stroke-width="1.6" fill="white"/><circle cx="946" cy="202" r="8" stroke="#245a9b" stroke-width="1.6" fill="white"/><path d="M668 348 L946 202" stroke="#0c8e9a" stroke-width="2" fill="none" /><circle cx="723.6" cy="318.8" r="5" stroke="#0c8e9a" stroke-width="1.6" fill="white"/><path d="M723.6 318.8 L737.6 298.8" stroke="#8494a4" stroke-width="1" fill="none" marker-end="url(#a5)"/><circle cx="779.2" cy="289.6" r="5" stroke="#0c8e9a" stroke-width="1.6" fill="white"/><path d="M779.2 289.6 L793.2 269.6" stroke="#8494a4" stroke-width="1" fill="none" marker-end="url(#a5)"/><circle cx="834.8" cy="260.4" r="5" stroke="#0c8e9a" stroke-width="1.6" fill="white"/><path d="M834.8 260.4 L848.8 240.39999999999998" stroke="#8494a4" stroke-width="1" fill="none" marker-end="url(#a5)"/><circle cx="890.4" cy="231.2" r="5" stroke="#0c8e9a" stroke-width="1.6" fill="white"/><path d="M890.4 231.2 L904.4 211.2" stroke="#8494a4" stroke-width="1" fill="none" marker-end="url(#a5)"/><text x="1010" y="208" font-size="16" font-weight="400" style="fill:#245a9b" text-anchor="start">原生锚点</text><text x="855" y="344" font-size="17" font-weight="400" style="fill:#0c8e9a" text-anchor="start">中间坐标联合求解</text><text x="594" y="431" font-size="20" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">p*(α) = (1−α) fθ(q₀) + α fθ(q₁)</text><text x="594" y="466" font-size="20" font-weight="400" style="fill:#172c43" text-anchor="start" class="math">q*(α) = argmin ‖r(fθ(q), p*(α))‖²</text><path d="M28 498 L1172 498" stroke="#dce4eb" stroke-width="1" fill="none" /><text x="35" y="536" font-size="20" font-weight="700" style="fill:#245a9b" text-anchor="start">原生拟合 Fnative</text><path d="M250 529 L352 529" stroke="#8494a4" stroke-width="1.5" fill="none" marker-end="url(#a5)"/><text x="370" y="536" font-size="20" font-weight="700" style="fill:#0c8e9a" text-anchor="start">协调前 / 协调后 Fexport</text><path d="M674 529 L764 529" stroke="#8494a4" stroke-width="1.5" fill="none" marker-end="url(#a5)"/><text x="782" y="536" font-size="20" font-weight="700" style="fill:#d48333" text-anchor="start">实际文件回读</text><text x="35" y="581" font-size="18" font-weight="400" style="fill:#172c43" text-anchor="start">锚点坐标逐值保持；中间目标是插值假设，由D的观测支持门控。</text><text x="35" y="619" font-size="17" font-weight="400" style="fill:#172c43" text-anchor="start">不同区间有批处理空间；当前refine仍携带前态，不能未经验证便把全部中间帧拆成独立任务。</text><text x="35" y="661" font-size="18" font-weight="700" style="fill:#172c43" text-anchor="start">SO(3)路径、坐标连续正则、旋转测地验收各司其职；三者不能互相代替。</text></svg>