<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 555" role="img" aria-labelledby="t5 d5"><title id="t5">输出路径：原生拟合、插值与回读分别验收</title><desc id="d5">关节旋转采用 SO(3) 路径；多个关节分别平滑，仍可能产生不理想的末端运动。</desc><defs><marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#657789"/></marker></defs><rect width="1200" height="555" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#19334a}.small{font-size:16px;fill:#657789}.body{font-size:18px}.head{font-size:20px;font-weight:700}</style><text x="32" y="37" font-size="26" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">05  输出路径：原生拟合、插值与回读分别验收</text><text x="32" y="66" font-size="16" font-weight="400" fill="#657789" style="fill:#657789" text-anchor="start">关节旋转采用 SO(3) 路径；多个关节分别平滑，仍可能产生不理想的末端运动。</text><text x="35" y="115" font-size="19" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">A  原生锚点固定</text><path d="M65 190 L1110 190" stroke="#a6b3be" stroke-width="2" fill="none"/><circle cx="65" cy="190" r="9" fill="#315b92"/><text x="65" y="165" font-size="19" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="middle">qₜ</text><circle cx="410" cy="190" r="9" fill="#315b92"/><text x="410" y="165" font-size="19" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="middle">qₜ</text><circle cx="755" cy="190" r="9" fill="#315b92"/><text x="755" y="165" font-size="19" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="middle">qₜ</text><circle cx="1110" cy="190" r="9" fill="#315b92"/><text x="1110" y="165" font-size="19" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="middle">qₜ</text><circle cx="151" cy="190" r="5" fill="#a6b3be"/><circle cx="237" cy="190" r="5" fill="#a6b3be"/><circle cx="323" cy="190" r="5" fill="#a6b3be"/><circle cx="496" cy="190" r="5" fill="#a6b3be"/><circle cx="582" cy="190" r="5" fill="#a6b3be"/><circle cx="668" cy="190" r="5" fill="#a6b3be"/><circle cx="841" cy="190" r="5" fill="#a6b3be"/><circle cx="927" cy="190" r="5" fill="#a6b3be"/><circle cx="1013" cy="190" r="5" fill="#a6b3be"/><text x="35" y="230" font-size="18" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">蓝点：已拟合原生坐标；灰点：新增导出采样。全部输出仍由同一固定模型 FK 产生。</text><rect x="35" y="274" width="340" height="130" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="51" y="303" font-size="19" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">B  SO(3) 插值</text><text x="51" y="330" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">旋转群上的连续旋转路径</text><text x="51" y="353" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">回到模型坐标与耦合</text><text x="51" y="376" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">保留原生采样点</text><rect x="430" y="274" width="340" height="130" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="446" y="303" font-size="19" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">C  协调中间姿态</text><text x="446" y="330" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">原生 FK 端点线性插值作目标</text><text x="446" y="353" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">按 D 的支持掩码门控</text><text x="446" y="376" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">联合关节重求解；锚点不动</text><rect x="825" y="274" width="340" height="130" rx="6" fill="#fff7e8" stroke="#b57418" stroke-width="1.4" /><text x="841" y="303" font-size="19" font-weight="700" fill="#b57418" style="fill:#b57418" text-anchor="start">D  文件输出与独立回读</text><text x="841" y="330" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">协调前 → 协调后 → 实际文件</text><text x="841" y="353" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">D 时钟 / R 时钟分别验证</text><text x="841" y="376" font-size="16" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">报告插值新增误差与原生误差</text><path d="M375,338 L428,338" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow5)" /><path d="M770,338 L823,338" stroke="#657789" stroke-width="1.7" fill="none" marker-end="url(#arrow5)" /><rect x="35" y="439" width="1130" height="80" rx="6" fill="#f4f6f8" stroke="#a6b3be" stroke-width="1.4" /><text x="52" y="470" font-size="18" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">批处理空间：独立区间与中间帧的 FK / 残差。当前复用逐帧 refine，连续初值仍需显式处理。</text><text x="52" y="499" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">线性端点路径是插值假设；它未增加观测信息。直接移除连续初值或减少导出采样要另作算法条件。</text></svg>