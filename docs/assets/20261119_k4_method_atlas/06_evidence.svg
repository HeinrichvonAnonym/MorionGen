<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="t6 d6"><title id="t6">性能证据：局部计算快，整体循环仍受限制</title><desc id="d6">两个面板来自不同实验，计时范围不同；不可把内核倍数直接视为整条 K 加速倍数。</desc><defs><marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#657789"/></marker></defs><rect width="1200" height="530" fill="white"/><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#19334a}.small{font-size:16px;fill:#657789}.body{font-size:18px}.head{font-size:20px;font-weight:700}</style><text x="32" y="37" font-size="26" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">06  性能证据：局部计算快，整体循环仍受限制</text><text x="32" y="66" font-size="16" font-weight="400" fill="#657789" style="fill:#657789" text-anchor="start">两个面板来自不同实验，计时范围不同；不可把内核倍数直接视为整条 K 加速倍数。</text><text x="35" y="112" font-size="19" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">A  固定32帧 FK 请求 · 预热中位数 / ms</text><text x="35" y="164" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">逐算子执行</text><rect x="239" y="147" width="215" height="30" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="465.46000000000004" y="169" font-size="17" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">34.20</text><text x="35" y="240" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">CUDA Graph</text><rect x="239" y="223" width="46" height="30" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="295.99" y="245" font-size="17" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">7.30</text><text x="35" y="316" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">Graph + 坐标批变换</text><rect x="239" y="299" width="32" height="30" rx="6" fill="#edf7f5" stroke="#137e79" stroke-width="1.4" /><text x="281.94100000000003" y="321" font-size="17" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">5.07</text><text x="35" y="402" font-size="18" font-weight="700" fill="#137e79" style="fill:#137e79" text-anchor="start">局部约 6.8×；同请求边界，含往返。</text><text x="625" y="112" font-size="19" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">B  150帧姿态细化 · 预热中位数 / s</text><text x="625" y="164" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">控制实现</text><rect x="756" y="147" width="290.95459999999997" height="30" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="1058.9546" y="169" font-size="17" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">76.57</text><text x="625" y="240" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">轻量传输</text><rect x="756" y="223" width="262.4242" height="30" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="1030.4242" y="245" font-size="17" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">69.06</text><text x="625" y="316" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">组合优化</text><rect x="756" y="299" width="250.94819999999999" height="30" rx="6" fill="#eff4fa" stroke="#315b92" stroke-width="1.4" /><text x="1018.9482" y="321" font-size="17" font-weight="700" fill="#19334a" style="fill:#19334a" text-anchor="start">66.04</text><text x="625" y="402" font-size="18" font-weight="700" fill="#315b92" style="fill:#315b92" text-anchor="start">局部姿态细化减少 13.7%；约 2.27 帧/s。</text><path d="M590 102 L590 421" stroke="#a6b3be" stroke-width="2" fill="none"/><text x="35" y="461" font-size="19" font-weight="700" fill="#b57418" style="fill:#b57418" text-anchor="start">整段9项已剖析任务：CPU线性子问题占合计求解时间约83.2%。范围仅覆盖这9项。</text><text x="35" y="494" font-size="17" font-weight="400" fill="#19334a" style="fill:#19334a" text-anchor="start">相同输入 / 候选，原14个CPU worker并行；计时复用既有模型与种子，完整部署延迟、全候选吞吐与GPU默认资格仍待验证。</text></svg>