<!doctype html><html lang="zh"><meta charset="utf-8"><title>匿名姿态盲评</title>
<style>body{font:16px system-ui;background:#f4f6fa;color:#192435;max-width:1250px;margin:30px auto;padding:20px}h1{font-size:27px}.views{display:flex;gap:12px}canvas{background:white;width:32%;border:1px solid #cfd7e2;border-radius:12px}button,select,input{font:inherit;padding:8px;margin:5px}fieldset{background:white;border:1px solid #ccd3df;border-radius:10px;margin:12px 0}label{display:inline-block;min-width:180px}small{color:#526276}#status{font-weight:600}textarea{width:95%;min-height:65px}</style>
<h1>匿名人体姿态评分包</h1><p>只显示动作和观察条件，隐藏方法、干预及自动评分。骨架缺少必要信息时选择“无法判读”，不要按中立姿态补全。此页面未包含已完成人工核验的结果。</p>
<label>评分员匿名编号 <input id="rater" placeholder="自行填写"></label><button id="previous">上一项</button><select id="sample"></select><button id="next">下一项</button><span id="status"></span>
<div class="views"><canvas width="400" height="440"></canvas><canvas width="400" height="440"></canvas><canvas width="400" height="440"></canvas></div>
<p><label>观察帧 <select id="frame"></select></label><label>视角旋转 <input id="yaw" type="range" min="-180" max="180" value="0"></label><small>三个视角使用相同空间尺度；可切换目标帧前后约 0.5 秒。邻帧不替代职业暴露条件。</small></p>
<p id="conditions"></p><div id="form"></div><fieldset><legend>缺项与理由</legend><textarea id="notes" placeholder="记录腕部、支撑、负载等无法判读项目及原因"></textarea></fieldset>
<button id="save">保存此项</button><button id="export">导出评分 JSON</button><p>本机浏览器临时保存评分；请导出文件留存。行动等级由之后的独立规则核对生成，不在盲评时显示自动答案。</p>
<script>
const samples=__POSE_DATA__;let index=0;const answers=JSON.parse(localStorage.getItem('motiongen-blind-ratings-v1')||'{}');
const ranges={RULA:{upper_arm:[1,6],lower_arm:[1,3],wrist:[1,4],wrist_twist:[1,2],neck:[1,6],trunk:[1,6],legs:[1,2],load:[0,3],muscle_use:[0,1],total:[1,7]},REBA:{upper_arm:[1,6],lower_arm:[1,2],wrist:[1,3],neck:[1,3],trunk:[1,5],legs:[1,4],load:[0,3],coupling:[0,3],activity:[0,3],total:[1,15]}};
const labels={upper_arm:'上臂（含修正）',lower_arm:'前臂（含修正）',wrist:'腕部（含修正）',wrist_twist:'前臂旋转档位',neck:'颈部（含修正）',trunk:'躯干（含修正）',legs:'腿部（含修正）',load:'负载／外力修正',muscle_use:'静态／重复使用',coupling:'握持／耦合',activity:'活动修正合计',total:'总分（输入完整时）'};
document.querySelector('#form').innerHTML=['left','right'].map(side=>`<fieldset><legend>${side==='left'?'左侧':'右侧'} · 独立评分</legend>${['RULA','REBA'].map(method=>`<p><b>${method}</b></p>${Object.entries(ranges[method]).map(([f,[lo,hi]])=>`<label>${labels[f]}<select data-key="${side}_${method}_${f}"><option value="">尚未评分</option><option value="unobservable">无法判读</option><option value="not_applicable">不适用</option>${Array.from({length:hi-lo+1},(_,i)=>`<option value="${i+lo}">${i+lo}</option>`).join('')}</select></label>`).join('')}`).join('')}</fieldset>`).join('');
const selector=document.querySelector('#sample');samples.forEach((s,i)=>selector.add(new Option(`${i+1} / ${samples.length} · ${s.id}`,i)));
function draw(){const s=samples[index],frame=+document.querySelector('#frame').value,pose=s.poses[frame],yaw=+document.querySelector('#yaw').value*Math.PI/180;const color=i=>(s.left_indices||[]).includes(i)?'#cf650f':(s.right_indices||[]).includes(i)?'#8552ac':'#2367a6';document.querySelectorAll('canvas').forEach((canvas,k)=>{const ctx=canvas.getContext('2d');ctx.clearRect(0,0,400,440);ctx.fillStyle='#526276';ctx.fillText(['视角 A','视角 B（+90°）','视角 C（+180°）'][k],16,24);const angle=yaw+k*Math.PI/2;const point=p=>[200+130*(p[0]*Math.cos(angle)-p[1]*Math.sin(angle)),255-130*p[2]];ctx.lineWidth=3;for(const [a,b]of s.edges){const u=point(pose[a]),v=point(pose[b]);ctx.strokeStyle=color(b);ctx.beginPath();ctx.moveTo(...u);ctx.lineTo(...v);ctx.stroke()}pose.forEach((p,i)=>{ctx.fillStyle=color(i);ctx.beginPath();ctx.arc(...point(p),2.5,0,Math.PI*2);ctx.fill()});for(const [side,i]of Object.entries(s.wrist_indices||{})){const p=point(pose[i]);ctx.fillStyle=color(i);ctx.fillText(side==='left'?'左腕':'右腕',p[0]+5,p[1]-5)}ctx.strokeStyle='#8795a7';ctx.fillStyle='#526276';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(20,410);ctx.lineTo(150,410);ctx.stroke();ctx.fillText('1 m',65,430)})}
function load(){selector.value=index;const s=samples[index],f=document.querySelector('#frame');f.replaceChildren();s.offset_seconds.forEach((t,i)=>f.add(new Option(t===0?'目标姿态':`${t.toFixed(2)} 秒`,i)));f.value=s.selected;document.querySelector('#conditions').textContent=s.task_conditions;const saved=answers[s.id]||{};document.querySelectorAll('[data-key]').forEach(e=>e.value=saved[e.dataset.key]??'');document.querySelector('#notes').value=saved.notes||'';document.querySelector('#status').textContent=`已保存 ${Object.keys(answers).length} 项`;draw()}
document.querySelector('#save').onclick=()=>{const s=samples[index],row={rater:document.querySelector('#rater').value,notes:document.querySelector('#notes').value,recorded_at:new Date().toISOString()};document.querySelectorAll('[data-key]').forEach(e=>row[e.dataset.key]=e.value);answers[s.id]=row;localStorage.setItem('motiongen-blind-ratings-v1',JSON.stringify(answers));load()};
document.querySelector('#previous').onclick=()=>{index=Math.max(0,index-1);load()};document.querySelector('#next').onclick=()=>{index=Math.min(samples.length-1,index+1);load()};selector.onchange=()=>{index=+selector.value;load()};document.querySelector('#frame').onchange=draw;document.querySelector('#yaw').oninput=draw;
document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:1,answers},null,2)],{type:'application/json'}));a.download='anonymous_ergonomic_ratings.json';a.click();URL.revokeObjectURL(a.href)};load();
</script></html>
